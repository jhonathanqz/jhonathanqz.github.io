  <base href="/">

  <meta charset="UTF-8">

  <meta name="theme-color" content="#060A13">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Jhonathan Queiroz — Senior Flutter Engineer">
  <meta property="og:description" content="Mobile Architect · Offline-First · CI/CD · Payment Systems · 90+ apps entregues.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Jhonathan Queiroz">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Jhonathan Queiroz — Senior Flutter Engineer</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #060A13; }
    #loader {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      background: #060A13; transition: opacity .5s ease; z-index: 10;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #8D9AB5; font-size: 13px; letter-spacing: 2px;
    }
    #loader.hide { opacity: 0; pointer-events: none; }
    .ring {
      width: 54px; height: 54px; border-radius: 50%;
      border: 3px solid #1E2942; border-top-color: #4FC3F7;
      border-right-color: #2EE6A6; animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loader">
    <div class="ring"></div>
    <div>JHONATHAN QUEIROZ</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loader');
      loader.classList.add('hide');
      setTimeout(function () { loader.remove(); }, 600);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
